name: ai-stack

services:
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "11435:8080"
    configs:
      - source: swap_cfg
        target: /app/config.yaml
    volumes:
      - /data/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: all, capabilities: [gpu]}
    networks: [ai-net]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - BASE_URL=http://searxng:8080/
      - INSTANCE_NAME=SearXNG
      - BIND_ADDRESS=0.0.0.0:8080
    volumes:
      - /data/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [ai-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`search.mallard`)
      - traefik.http.routers.searxng.entrypoints=web
      - traefik.http.services.searxng.loadbalancer.server.port=8080

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      - DOMAIN_CLIENT=http://192.168.1.121:3080
      - DOMAIN_SERVER=http://192.168.1.121:3080
      - CREDS_KEY=${LIBRECHAT_CREDS_KEY}
      - CREDS_IV=${LIBRECHAT_CREDS_IV}
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET}
      - ALLOW_REGISTRATION=true
      - SEARCH=true
      - SEARCH_PROVIDER=searxng
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "3080:3080"
    configs:
      - source: librechat_cfg
        target: /app/librechat.yaml
    volumes:
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/api/logs
    depends_on: [llama-swap, searxng]
    networks: [ai-net, data-net, proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.librechat.rule=Host(`chat.mallard`)
      - traefik.http.routers.librechat.entrypoints=web
      - traefik.http.services.librechat.loadbalancer.server.port=3080

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=192.168.1.121
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://192.168.1.121:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [ai-net, data-net, proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.mallard`)
      - traefik.http.routers.n8n.entrypoints=web
      - traefik.http.services.n8n.loadbalancer.server.port=5678

configs:
  swap_cfg:
    content: |
      healthCheckTimeout: 180
      models:
        "qwen-3b":
          cmd: /app/llama-server --port $${PORT} -m /models/qwen2.5-3b-instruct-q4_k_m.gguf -ngl 99 -c 4096
          ttl: 300
        "qwen-coder-3b":
          cmd: /app/llama-server --port $${PORT} -m /models/qwen2.5-coder-3b-instruct-q5_k_m.gguf -ngl 30 -c 4096
          ttl: 300
        "phi-3-mini":
          cmd: /app/llama-server --port $${PORT} -m /models/Phi-3-mini-4k-instruct-q4.gguf -ngl 24 -c 2048
          ttl: 300
  librechat_cfg:
    content: |
      version: 1.2.1
      cache: true
      endpoints:
        custom:
          - name: "Mallard llama.cpp"
            apiKey: "none"
            baseURL: "http://llama-swap:8080/v1"
            models:
              default: ["qwen-3b", "qwen-coder-3b", "phi-3-mini"]
              fetch: true
            titleConvo: true
            titleModel: "qwen-3b"

volumes:
  librechat_images:  {name: librechat_images}
  librechat_uploads: {name: librechat_uploads}
  librechat_logs:    {name: librechat_logs}
  n8n_data:          {name: n8n_data}

networks:
  ai-net:   {name: ai-net}
  proxy:    {external: true, name: proxy}
  data-net: {external: true, name: data-net}
